server {
    listen 80;
    server_name _;

    # DNS interno de Docker. Sin esto Nginx resuelve `app` una sola vez al
    # arrancar y, en cuanto se recrea el contenedor, sigue hablando con la IP
    # muerta y responde 502 hasta que alguien reinicia este contenedor. El
    # upstream va en variable porque solo así Nginx vuelve a resolverlo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Fotos de documentos de la PWA Conductor (hasta ~300 MB).
    client_max_body_size 320M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff2;

    # Vite le pone un hash al nombre de cada archivo compilado
    # (app-CZrleO5P.css, Index-9gX_cdrr.js...): si el contenido cambia,
    # cambia el nombre. Por eso son inmutables y el navegador puede
    # quedárselos para siempre en vez de revalidar en cada visita.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        # fastcgi_params no reenvia esta por defecto: sin ella PHP-FPM nunca
        # ve la cabecera Authorization y el Bearer token de la PWA (Sanctum),
        # por válido que sea, responde 401 Unauthenticated.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        set $fpm app:9000;
        fastcgi_pass $fpm;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        # Subidas grandes (fotos de documentos) necesitan más que el timeout
        # por defecto.
        fastcgi_read_timeout 600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
