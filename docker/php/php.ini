; Ajustes de PHP para producción. Se cargan al final de conf.d, así que
; sobrescriben los valores por defecto de la imagen oficial.

memory_limit = 512M
max_execution_time = 300

; La PWA Conductor sube fotos de documentos (hasta ~300 MB declarados en la
; app); dejamos margen encima de eso.
upload_max_filesize = 320M
post_max_size = 325M

date.timezone = America/Lima
expose_php = Off

; El código nunca cambia sin reconstruir la imagen, de modo que OPcache no
; necesita comprobar fechas de modificación en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Los logs van a stderr para que `docker compose logs` los recoja.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
