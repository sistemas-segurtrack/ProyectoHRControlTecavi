[www]

; El proceso maestro arranca como root para poder crear los workers con este
; usuario. Los workers, que son los que ejecutan tu código, nunca son root.
user = www-data
group = www-data

listen = 9000

; IMPRESCINDIBLE. Por defecto php-fpm limpia el entorno de los workers, y
; entonces Laravel no ve ninguna de las variables que inyecta Compose desde
; el .env: te encuentras la aplicación sin base de datos y sin token de
; Wialon, sin ningún error que lo explique.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

; Que la salida de los workers llegue a `docker compose logs` sin adornos.
catch_workers_output = yes
decorate_workers_output = no

; Avisa si una petición tarda más de 60s: suele ser una subida grande de la
; PWA que debería estar en cola y no en una petición web.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 60s
