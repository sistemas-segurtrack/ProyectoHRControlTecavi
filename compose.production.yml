# Build args que necesitan las etapas `app` y `web` (ambas compilan su propia
# copia de public/build): se hornean dentro del JavaScript. APP_URL en
# particular es la misma que usa el contenedor `app` en runtime (viene del
# mismo `.env`) — Wayfinder la necesita en build-time para generar rutas
# absolutas correctas (ver comentario en el Dockerfile).
x-vite: &vite
    VITE_APP_NAME: ${VITE_APP_NAME:-Proyecto Tecavi - HRControl}
    VITE_PWA_BASE_PATH: ${PWA_BASE_PATH:-}
    APP_URL: ${APP_URL:-http://localhost}

services:
    app:
        # La única imagen PHP: la cola y el scheduler son este mismo contenedor
        # con otro comando y la reutilizan por esta etiqueta.
        image: hrcontrol-php
        build:
            context: .
            target: app
            args: *vite
        env_file:
            - .env
        volumes:
            - /var/opt/proyectos/segurtrack/tecavi/HRControl/storage:/var/www/html/storage:z
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    web:
        build:
            context: .
            target: web
            args: *vite
        ports:
            - '127.0.0.1:${APP_PORT:-8090}:80'
        # Mismo volumen que `app`, de solo lectura: nginx sirve las fotos de
        # documentos (`/storage/...`) directo desde disco, sin pasar por
        # PHP-FPM — sin este volumen, el symlink `public/storage` de la
        # imagen (ver Dockerfile) apunta a un directorio vacío y todo 404.
        volumes:
            - /var/opt/proyectos/segurtrack/tecavi/HRControl/storage:/var/www/html/storage:ro,z
        depends_on:
            - app
        restart: unless-stopped

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - /var/opt/proyectos/segurtrack/tecavi/HRControl/mysql:/var/lib/mysql:Z
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u${DB_USERNAME}',
                    '-p${DB_PASSWORD}',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    queue:
        image: hrcontrol-php
        env_file:
            - .env
        command: ['bash', 'bin/queue-worker.sh', 'default', 'database']
        volumes:
            - /var/opt/proyectos/segurtrack/tecavi/HRControl/storage:/var/www/html/storage:z
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        image: hrcontrol-php
        env_file:
            - .env
        command: ['bash', 'bin/scheduler.sh']
        volumes:
            - /var/opt/proyectos/segurtrack/tecavi/HRControl/storage:/var/www/html/storage:z
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
